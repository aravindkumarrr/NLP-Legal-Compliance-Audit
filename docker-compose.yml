services:
  postgres:
    image: postgres:16
    container_name: lca_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: lca_user
      POSTGRES_PASSWORD: lca_password
      POSTGRES_DB: lca_db
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  qdrant:
    image: qdrant/qdrant:v1.11.3
    container_name: lca_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"   # REST API
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage

  neo4j:
    image: neo4j:5.24-community
    container_name: lca_neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/lca_password
      # Keep memory modest for a laptop with no dedicated GPU / shared RAM budget
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 512m
    ports:
      - "7474:7474"   # browser UI
      - "7687:7687"   # bolt protocol
    volumes:
      - neo4j_data:/data

volumes:
  pg_data:
  qdrant_data:
  neo4j_data:
